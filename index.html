<!doctype html>
<html>
<head>
    <meta name='viewport' content='width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover' />
    <meta charset='utf-8'>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <style></style>
    <title>Base FPS by Cal Schmidt</title>
    <script src="playcanvas-stable.min.js"></script>
    <script src="__settings__.js"></script>
</head>
<body>
    <script src="__modules__.js"></script>
    <script src="__start__.js"></script>
    <script src="__loading__.js"></script>

    <!-- Xbox controller hint overlay -->
    <div id="xbox-hint">
        <div class="xh-inner">
            <span class="xh-icon">🎮</span>
            <span class="xh-text">Xbox Controller Connected</span>
        </div>
    </div>

    <!-- Xbox controls legend (bottom-right, always visible) -->
    <div id="xbox-legend">
        <div class="xl-row"><span class="xl-btn ls">LS</span><span>Move</span></div>
        <div class="xl-row"><span class="xl-btn rs">RS</span><span>Look</span></div>
        <div class="xl-row"><span class="xl-btn rt">RT</span><span>Shoot</span></div>
        <div class="xl-row"><span class="xl-btn a">A</span><span>Jump</span></div>
        <div class="xl-row"><span class="xl-btn lb">LB</span><span>Sprint</span></div>
    </div>

    <script>
    // Show "controller connected" toast when a gamepad is plugged in
    window.addEventListener('gamepadconnected', function(e) {
        var hint = document.getElementById('xbox-hint');
        if (!hint) return;
        hint.classList.add('show');
        setTimeout(function() { hint.classList.remove('show'); }, 3000);
    });
    </script>
</body>
</html>
